version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose      # unclosed HTTP response bodies
    - errorlint      # correct error wrapping / comparison (errors.Is / errors.As)
    - gocritic       # style, performance and bug-prone patterns
    - gosec          # security issues
    - misspell       # typos in comments and strings
    - nilerr         # returning nil error after checking err != nil
    - noctx          # HTTP requests without context
    - revive         # general style (golint successor)
    - rowserrcheck   # unchecked sql.Rows.Err
    - sqlclosecheck  # unclosed sql.Rows / sql.Stmt
    - unconvert      # unnecessary type conversions

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam  # too noisy at early stage
    misspell:
      locale: US

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # Relax security checks in tests
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/<username>/synapse

issues:
  max-issues-per-linter: 0
  max-same-issues: 0